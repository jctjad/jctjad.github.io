name: Update Research Vectors

on:
  push:
    paths:
      - "index.html"          # regenerate whenever publications change
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to push the updated JSON

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update script
        run: python3 scripts/update_vectors.py

      - name: Commit updated JSON (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/research-vectors.json
          if git diff --cached --quiet; then
            echo "No changes to research-vectors.json — skipping commit."
          else
            git commit -m "chore: regenerate research-vectors.json [skip ci]"
            git push
          fi
